name: Build Pro Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create --platforms=android -a kotlin --org com.proplayer --project-name pro_player app_build
          cd app_build
          rm -rf test
          flutter pub add 'media_kit:^1.1.11' 'media_kit_video:^1.2.5' 'media_kit_libs_video:^1.0.5' 'file_picker:^8.0.0' 'shared_preferences:^2.2.3' 'http:^1.2.1'

      - name: Configure Android (minSdk + Internet permission)
        run: |
          cd app_build/android/app
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' build.gradle* || true
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' src/main/AndroidManifest.xml

      - name: Write App Code (lib/main.dart)
        run: |
          cat << 'EOF' > app_build/lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:http/http.dart' as http;
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            runApp(const App());
          }

          class App extends StatelessWidget {
            const App({super.key});
            @override
            Widget build(BuildContext c) => MaterialApp(
                  debugShowCheckedModeBanner: false,
                  title: 'Pro Player',
                  locale: const Locale('ar'),
                  supportedLocales: const [Locale('ar'), Locale('en')],
                  builder: (c, w) => Directionality(textDirection: TextDirection.rtl, child: w!),
                  theme: ThemeData(
                    useMaterial3: true,
                    brightness: Brightness.dark,
                    colorSchemeSeed: const Color(0xFF3E91FF),
                    scaffoldBackgroundColor: const Color(0xFF0B0D12),
                  ),
                  home: const Home(),
                );
          }

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            List<Map<String, dynamic>> recents = [];
            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              final l = (p.getStringList('recents') ?? []).map((e) => jsonDecode(e) as Map<String, dynamic>).toList();
              setState(() => recents = l);
            }

            Future<void> _open(String src, String title) async {
              final p = await SharedPreferences.getInstance();
              recents.removeWhere((e) => e['src'] == src);
              recents.insert(0, {'src': src, 'title': title});
              await p.setStringList('recents', recents.take(30).map(jsonEncode).toList());
              if (!mounted) return;
              await Navigator.push(context, MaterialPageRoute(builder: (_) => PlayerPage(source: src, title: title)));
              _load();
            }

            Future<void> _pick() async {
              final r = await FilePicker.platform.pickFiles(type: FileType.video);
              final f = r?.files.single;
              if (f?.path != null) _open(f!.path!, f.name);
            }

            Future<void> _url() async {
              final t = TextEditingController();
              final u = await showDialog<String>(
                context: context,
                builder: (c) => AlertDialog(
                  title: const Text('تشغيل رابط'),
                  content: TextField(controller: t, textDirection: TextDirection.ltr, decoration: const InputDecoration(hintText: 'https://...')),
                  actions: [TextButton(onPressed: () => Navigator.pop(c, t.text.trim()), child: const Text('تشغيل'))],
                ),
              );
              if (u != null && u.isNotEmpty) _open(u, u);
            }

            @override
            Widget build(BuildContext c) => Scaffold(
                  appBar: AppBar(title: const Text('Pro Player', style: TextStyle(fontWeight: FontWeight.w800)), backgroundColor: Colors.transparent),
                  body: recents.isEmpty
                      ? const Center(child: Text('اختر فيديو للبدء 🎬', style: TextStyle(color: Colors.white54, fontSize: 16)))
                      : ListView.builder(
                          padding: const EdgeInsets.all(12),
                          itemCount: recents.length,
                          itemBuilder: (c, i) => Card(
                            color: const Color(0xFF151922),
                            child: ListTile(
                              leading: const Icon(Icons.play_circle_fill, size: 38, color: Color(0xFF3E91FF)),
                              title: Text(recents[i]['title'], maxLines: 1, overflow: TextOverflow.ellipsis),
                              onTap: () => _open(recents[i]['src'], recents[i]['title']),
                            ),
                          ),
                        ),
                  floatingActionButtonLocation: FloatingActionButtonLocation.centerFloat,
                  floatingActionButton: Row(mainAxisSize: MainAxisSize.min, children: [
                    FloatingActionButton.extended(heroTag: 'a', onPressed: _pick, icon: const Icon(Icons.folder_open), label: const Text('فتح فيديو')),
                    const SizedBox(width: 12),
                    FloatingActionButton(heroTag: 'b', onPressed: _url, child: const Icon(Icons.link)),
                  ]),
                );
          }

          // ===== مشغل الفيديو =====
          class PlayerPage extends StatefulWidget {
            final String source, title;
            const PlayerPage({super.key, required this.source, required this.title});
            @override
            State<PlayerPage> createState() => _PlayerPageState();
          }

          class _PlayerPageState extends State<PlayerPage> {
            final player = Player();
            late final controller = VideoController(player);
            bool show = true, locked = false, looping = false;
            String enh = 'off';
            BoxFit fit = BoxFit.contain;
            double speed = 1, vol = 100;
            int bright = 0;
            Timer? _hide, _sleep;
            String? toast;
            Timer? _toastT;
            final ai = AiService();
            final chat = <Map<String, String>>[];
            List<Cue>? _cues;
            bool _translating = false;

            @override
            void initState() {
              super.initState();
              SystemChrome.setPreferredOrientations([DeviceOrientation.landscapeLeft, DeviceOrientation.landscapeRight]);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
              _start();
            }

            Future<void> _start() async {
              final p = await SharedPreferences.getInstance();
              await player.open(Media(widget.source));
              final pos = p.getInt('pos_${widget.source}');
              if (pos != null && pos > 5) {
                await player.stream.duration.firstWhere((d) => d > Duration.zero);
                await player.seek(Duration(seconds: pos));
                _toast('استئناف من ${_fmt(Duration(seconds: pos))}');
              }
              _autoHide();
            }

            @override
            void dispose() {
              SharedPreferences.getInstance().then((p) => p.setInt('pos_${widget.source}', player.state.position.inSeconds));
              _hide?.cancel();
              _sleep?.cancel();
              player.dispose();
              SystemChrome.setPreferredOrientations(DeviceOrientation.values);
              SystemChrome.setEnabledSystemUIMode(SystemUiMode.edgeToEdge);
              super.dispose();
            }

            String _fmt(Duration d) {
              String t(int n) => n.toString().padLeft(2, '0');
              return d.inHours > 0 ? '${d.inHours}:${t(d.inMinutes % 60)}:${t(d.inSeconds % 60)}' : '${t(d.inMinutes)}:${t(d.inSeconds % 60)}';
            }

            void _toast(String m) {
              setState(() => toast = m);
              _toastT?.cancel();
              _toastT = Timer(const Duration(milliseconds: 1100), () => mounted ? setState(() => toast = null) : null);
            }

            void _autoHide() {
              _hide?.cancel();
              _hide = Timer(const Duration(seconds: 4), () => mounted && player.state.playing ? setState(() => show = false) : null);
            }

            void _seekBy(int s) {
              final t = player.state.position + Duration(seconds: s);
              player.seek(t < Duration.zero ? Duration.zero : t);
              _toast(s > 0 ? '+$s ثانية ⏩' : '⏪ $s ثانية');
            }

            Future<void> _setEnh(String k, {Map<String, dynamic>? custom}) async {
              setState(() => enh = k);
              await Enhancer.apply(player, k, custom: custom);
              _toast(k == 'off' ? 'تم إيقاف التحسين' : 'تحسين الجودة: ${custom != null ? 'مخصص' : Enhancer.presets[k]!['label']}');
            }

            Future<void> _setLoopAB(num a, num b) async {
              final n = player.platform as NativePlayer;
              await n.setProperty('ab-loop-a', '$a');
              await n.setProperty('ab-loop-b', '$b');
              _toast('تكرار المقطع ${_fmt(Duration(seconds: a.toInt()))} - ${_fmt(Duration(seconds: b.toInt()))}');
            }

            Future<void> _loopOff() async {
              final n = player.platform as NativePlayer;
              await n.setProperty('ab-loop-a', 'no');
              await n.setProperty('ab-loop-b', 'no');
              await player.setPlaylistMode(PlaylistMode.none);
              setState(() => looping = false);
            }

            /// ينفّذ أوامر المساعد الذكي
            Future<void> _run(Map a) async {
              final v = a['value'];
              switch (a['name']) {
                case 'play': player.play(); break;
                case 'pause': player.pause(); break;
                case 'toggle': player.playOrPause(); break;
                case 'mute': player.setVolume(0); break;
                case 'unmute': player.setVolume(100); break;
                case 'seek': _seekBy((v as num).toInt()); break;
                case 'seek_to': player.seek(Duration(seconds: (v as num).toInt())); break;
                case 'speed': setState(() => speed = (v as num).toDouble()); player.setRate(speed); break;
                case 'volume': setState(() => vol = (v as num).toDouble()); player.setVolume(vol); break;
                case 'loop_file':
                  looping = v == true;
                  await player.setPlaylistMode(looping ? PlaylistMode.single : PlaylistMode.none);
                  setState(() {});
                  break;
                case 'loop_ab': await _setLoopAB(v['a'], v['b']); break;
                case 'loop_off': await _loopOff(); break;
                case 'enhance': await _setEnh('$v'); break;
                case 'enhance_custom':
                  await _setEnh('auto', custom: Map<String, dynamic>.from(v)..putIfAbsent('vf', () => ''));
                  break;
                case 'translate_subs': await _translateFlow('$v'); break;
                case 'subs_off': await _subsOff(); break;
                case 'subs_on': await _subsOn(); break;
                case 'fit': setState(() => fit = {'cover': BoxFit.cover, 'fill': BoxFit.fill}[v] ?? BoxFit.contain); break;
              }
            }

            // ---------------- واجهة ----------------
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                body: Stack(fit: StackFit.expand, children: [
                  Video(controller: controller, fit: fit, controls: NoVideoControls),
                  _gestures(),
                  if (toast != null)
                    Center(child: Container(padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 10), decoration: BoxDecoration(color: Colors.black87, borderRadius: BorderRadius.circular(30)), child: Text(toast!, style: const TextStyle(fontSize: 16)))),
                  if (show && !locked) _controls(),
                  if (show && locked)
                    Positioned(left: 20, top: 0, bottom: 0, child: Center(child: _round(Icons.lock_open, () => setState(() { locked = false; _autoHide(); })))),
                ]),
              );
            }

            Widget _gestures() => GestureDetector(
                  behavior: HitTestBehavior.translucent,
                  onTap: () { setState(() => show = !show); if (show) _autoHide(); },
                  onDoubleTapDown: locked ? null : (d) {
                    final w = MediaQuery.of(context).size.width;
                    d.localPosition.dx < w / 3 ? _seekBy(-10) : d.localPosition.dx > 2 * w / 3 ? _seekBy(10) : player.playOrPause();
                  },
                  onDoubleTap: () {},
                  onLongPressStart: locked ? null : (_) { player.setRate(2); _toast('سرعة 2x ⚡'); },
                  onLongPressEnd: locked ? null : (_) => player.setRate(speed),
                  onVerticalDragUpdate: locked ? null : (d) async {
                    final left = d.localPosition.dx < MediaQuery.of(context).size.width / 2;
                    final delta = -d.delta.dy;
                    if (left) {
                      bright = (bright + delta).clamp(-60, 60).round();
                      await (player.platform as NativePlayer).setProperty('brightness', '$bright');
                      _toast('السطوع $bright');
                    } else {
                      vol = (vol + delta).clamp(0.0, 100.0).toDouble();
                      player.setVolume(vol);
                      _toast('الصوت ${vol.round()}%');
                    }
                  },
                  onHorizontalDragUpdate: locked ? null : (d) => player.seek(player.state.position + Duration(milliseconds: (d.delta.dx * 250).round())),
                );

            Widget _round(IconData i, VoidCallback f, {double s = 26}) =>
                Material(color: Colors.black54, shape: const CircleBorder(), child: IconButton(icon: Icon(i, size: s), onPressed: f));

            Widget _controls() => SafeArea(
                  child: Column(children: [
                    Container(
                      decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Colors.black87, Colors.transparent])),
                      child: Row(children: [
                        IconButton(icon: const Icon(Icons.arrow_forward), onPressed: () => Navigator.pop(context)),
                        Expanded(child: Text(widget.title, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600))),
                        TextButton.icon(
                          onPressed: _enhanceSheet,
                          icon: Icon(Icons.auto_awesome, color: enh == 'off' ? Colors.white : const Color(0xFFFFD54F)),
                          label: Text(enh == 'off' ? 'تحسين' : 'AI', style: TextStyle(color: enh == 'off' ? Colors.white : const Color(0xFFFFD54F))),
                        ),
                        IconButton(
                          icon: Icon(Icons.translate, color: _translating ? const Color(0xFFFFD54F) : Colors.white),
                          tooltip: 'ترجمة',
                          onPressed: _translateSheet,
                        ),
                        IconButton(icon: const Icon(Icons.smart_toy_outlined), tooltip: 'المساعد', onPressed: _assistant),
                        IconButton(icon: const Icon(Icons.more_vert), onPressed: _moreSheet),
                      ]),
                    ),
                    const Spacer(),
                    Row(mainAxisAlignment: MainAxisAlignment.center, children: [
                      _round(Icons.replay_10, () => _seekBy(-10), s: 32),
                      const SizedBox(width: 28),
                      StreamBuilder<bool>(
                        stream: player.stream.playing,
                        builder: (c, s) => Material(
                          color: const Color(0xFF3E91FF), shape: const CircleBorder(),
                          child: IconButton(iconSize: 48, icon: Icon(s.data == true ? Icons.pause : Icons.play_arrow), onPressed: () { player.playOrPause(); _autoHide(); }),
                        ),
                      ),
                      const SizedBox(width: 28),
                      _round(Icons.forward_10, () => _seekBy(10), s: 32),
                    ]),
                    const Spacer(),
                    Container(
                      padding: const EdgeInsets.fromLTRB(12, 0, 12, 4),
                      decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.bottomCenter, end: Alignment.topCenter, colors: [Colors.black87, Colors.transparent])),
                      child: Column(children: [
                        StreamBuilder<Duration>(
                          stream: player.stream.position,
                          builder: (c, s) {
                            final pos = s.data ?? Duration.zero, dur = player.state.duration;
                            return Row(children: [
                              Text(_fmt(pos)),
                              Expanded(child: Slider(
                                value: pos.inMilliseconds.clamp(0, dur.inMilliseconds == 0 ? 1 : dur.inMilliseconds).toDouble(),
                                max: dur.inMilliseconds == 0 ? 1 : dur.inMilliseconds.toDouble(),
                                onChanged: (v) => player.seek(Duration(milliseconds: v.toInt())),
                              )),
                              Text(_fmt(dur)),
                            ]);
                          },
                        ),
                        Row(mainAxisAlignment: MainAxisAlignment.spaceAround, children: [
                          IconButton(icon: const Icon(Icons.lock_outline), onPressed: () => setState(() => locked = true)),
                          TextButton(onPressed: _speedSheet, child: Text('${speed}x')),
                          IconButton(icon: Icon(Icons.repeat, color: looping ? const Color(0xFF3E91FF) : Colors.white), onPressed: () async {
                            looping = !looping;
                            await player.setPlaylistMode(looping ? PlaylistMode.single : PlaylistMode.none);
                            setState(() {});
                            _toast(looping ? 'تكرار مفعّل 🔁' : 'التكرار متوقف');
                          }),
                          IconButton(icon: const Icon(Icons.subtitles_outlined), onPressed: _tracksSheet),
                          IconButton(icon: const Icon(Icons.aspect_ratio), onPressed: () {
                            setState(() => fit = fit == BoxFit.contain ? BoxFit.cover : fit == BoxFit.cover ? BoxFit.fill : BoxFit.contain);
                            _toast(fit == BoxFit.contain ? 'ملاءمة' : fit == BoxFit.cover ? 'ملء الشاشة' : 'تمديد');
                          }),
                        ]),
                      ]),
                    ),
                  ]),
                );

            // ---------- الترجمة بالذكاء الاصطناعي ----------
            static const _langs = ['العربية', 'English', 'Español', 'Français', 'Deutsch', 'Türkçe', 'Русский', '中文', '日本語', '한국어', 'हिन्दी', 'Português', 'Italiano', 'فارسی', 'اردو', 'Bahasa Indonesia'];

            Future<void> _subsOff() async {
              await player.setSubtitleTrack(SubtitleTrack.no());
              _toast('تم إخفاء الترجمة');
            }

            Future<void> _subsOn() async {
              await player.setSubtitleTrack(SubtitleTrack.auto());
              _toast('تم إظهار الترجمة');
            }

            Future<bool> _pickSubs() async {
              final r = await FilePicker.platform.pickFiles(type: FileType.custom, allowedExtensions: ['srt', 'vtt'], withData: true);
              final bytes = r?.files.single.bytes;
              if (bytes == null) return false;
              final cues = parseSubs(utf8.decode(bytes, allowMalformed: true));
              if (cues.isEmpty) {
                _toast('الملف لا يحتوي ترجمة صالحة');
                return false;
              }
              _cues = cues;
              return true;
            }

            Future<void> _translateFlow(String lang) async {
              if (_translating) return;
              if (_cues == null && !await _pickSubs()) return;
              final cues = _cues!;
              setState(() => _translating = true);
              try {
                final out = <String>[];
                const chunk = 60;
                for (var i = 0; i < cues.length; i += chunk) {
                  final end = i + chunk > cues.length ? cues.length : i + chunk;
                  out.addAll(await ai.translate(cues.sublist(i, end).map((c) => c.text).toList(), lang));
                  _toast('جاري الترجمة ${out.length}/${cues.length}');
                }
                await player.setSubtitleTrack(SubtitleTrack.data(buildSrt(cues, out), title: 'AI $lang', language: lang));
                _toast('تمت الترجمة إلى $lang ✅');
              } catch (e) {
                final msg = e.toString().replaceAll('Exception: ', '');
                _toast('تعذّرت الترجمة: $msg');
              }
              if (mounted) setState(() => _translating = false);
            }

            void _translateSheet() {
              final lc = TextEditingController();
              _sheet(Padding(
                padding: EdgeInsets.only(bottom: MediaQuery.of(context).viewInsets.bottom),
                child: ListView(shrinkWrap: true, padding: const EdgeInsets.all(14), children: [
                  const Text('الترجمة بالذكاء الاصطناعي', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  const SizedBox(height: 4),
                  Text(_cues == null ? 'اختر لغة ثم ملف الترجمة (SRT / VTT) وسيُترجم لها' : 'تم تحميل ${_cues!.length} سطر، اختر اللغة الهدف',
                      style: const TextStyle(color: Colors.white60, fontSize: 12)),
                  const SizedBox(height: 10),
                  Wrap(spacing: 6, runSpacing: 6, children: [
                    for (final l in _langs) ActionChip(label: Text(l), onPressed: () { Navigator.pop(context); _translateFlow(l); }),
                  ]),
                  const SizedBox(height: 10),
                  TextField(
                    controller: lc,
                    decoration: const InputDecoration(hintText: 'أو اكتب أي لغة أخرى ثم Enter', border: OutlineInputBorder()),
                    onSubmitted: (v) { if (v.trim().isNotEmpty) { Navigator.pop(context); _translateFlow(v.trim()); } },
                  ),
                  const Divider(),
                  ListTile(leading: const Icon(Icons.upload_file), title: const Text('اختيار ملف ترجمة آخر'), onTap: () async {
                    Navigator.pop(context);
                    final old = _cues;
                    _cues = null;
                    if (await _pickSubs()) { _translateSheet(); } else { _cues = old; }
                  }),
                  ListTile(leading: const Icon(Icons.subtitles_off_outlined), title: const Text('إزالة / إخفاء الترجمة'), onTap: () { Navigator.pop(context); _subsOff(); }),
                  ListTile(leading: const Icon(Icons.subtitles_outlined), title: const Text('إظهار الترجمة الأصلية'), onTap: () { Navigator.pop(context); _subsOn(); }),
                ]),
              ));
            }

            // ---------- Sheets ----------
            void _sheet(Widget child) => showModalBottomSheet(context: context, backgroundColor: const Color(0xFF151922), isScrollControlled: true, builder: (_) => SafeArea(child: child));

            void _enhanceSheet() => _sheet(ListView(shrinkWrap: true, children: [
                  const ListTile(title: Text('تحسين جودة الفيديو بالذكاء الاصطناعي', style: TextStyle(fontWeight: FontWeight.bold))),
                  for (final e in Enhancer.presets.entries)
                    ListTile(
                      leading: Icon(enh == e.key ? Icons.radio_button_checked : Icons.radio_button_off, color: enh == e.key ? const Color(0xFF3E91FF) : Colors.white54),
                      title: Text(e.value['label']),
                      onTap: () { Navigator.pop(context); _setEnh(e.key); },
                    ),
                ]));

            void _speedSheet() => _sheet(Wrap(children: [
                  for (final s in [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0])
                    Padding(padding: const EdgeInsets.all(6), child: ChoiceChip(label: Text('${s}x'), selected: speed == s, onSelected: (_) { setState(() => speed = s); player.setRate(s); Navigator.pop(context); })),
                ]));

            void _tracksSheet() {
              final t = player.state.tracks;
              _sheet(ListView(shrinkWrap: true, children: [
                const ListTile(title: Text('الصوت')),
                for (final a in t.audio) ListTile(title: Text(a.title ?? a.language ?? a.id), onTap: () { player.setAudioTrack(a); Navigator.pop(context); }),
                const ListTile(title: Text('الترجمة')),
                ListTile(title: const Text('بدون'), onTap: () { player.setSubtitleTrack(SubtitleTrack.no()); Navigator.pop(context); }),
                for (final s in t.subtitle) ListTile(title: Text(s.title ?? s.language ?? s.id), onTap: () { player.setSubtitleTrack(s); Navigator.pop(context); }),
              ]));
            }

            void _moreSheet() => _sheet(ListView(shrinkWrap: true, children: [
                  ListTile(leading: const Icon(Icons.bedtime_outlined), title: const Text('مؤقت النوم (30 دقيقة)'), onTap: () {
                    Navigator.pop(context);
                    _sleep?.cancel();
                    _sleep = Timer(const Duration(minutes: 30), () => player.pause());
                    _toast('سيتوقف التشغيل بعد 30 دقيقة');
                  }),
                  ListTile(leading: const Icon(Icons.repeat_one), title: const Text('تكرار مقطع A-B (الحالي + 15 ث)'), onTap: () {
                    Navigator.pop(context);
                    final a = player.state.position.inSeconds;
                    _setLoopAB(a, a + 15);
                  }),
                  ListTile(leading: const Icon(Icons.clear), title: const Text('إلغاء كل أنواع التكرار'), onTap: () { Navigator.pop(context); _loopOff(); }),
                ]));

            // ---------- المساعد الذكي ----------
            void _assistant() async {
              final tc = TextEditingController();
              bool busy = false;
              if (!mounted) return;
              showModalBottomSheet(
                context: context, isScrollControlled: true, backgroundColor: const Color(0xFF151922),
                builder: (_) => StatefulBuilder(builder: (c, set) {
                  Future<void> send() async {
                    final text = tc.text.trim();
                    if (text.isEmpty) return;
                    set(() { chat.add({'r': 'me', 't': text}); busy = true; tc.clear(); });
                    try {
                      final res = await ai.ask(text, {
                        'position_sec': player.state.position.inSeconds,
                        'duration_sec': player.state.duration.inSeconds,
                        'playing': player.state.playing, 'speed': speed, 'volume': vol, 'enhance': enh,
                      });
                      for (final a in (res['actions'] as List? ?? [])) { await _run(Map.from(a)); }
                      set(() => chat.add({'r': 'bot', 't': '${res['reply'] ?? 'تم ✅'}'}));
                    } catch (e) {
                      set(() => chat.add({'r': 'bot', 't': 'تعذّر التنفيذ: $e'}));
                    }
                    set(() => busy = false);
                  }

                  return Padding(
                    padding: EdgeInsets.only(bottom: MediaQuery.of(c).viewInsets.bottom),
                    child: SizedBox(height: MediaQuery.of(c).size.height * 0.7, child: Column(children: [
                      ListTile(
                        leading: const Icon(Icons.smart_toy, color: Color(0xFF3E91FF)),
                        title: const Text('المساعد الذكي'),
                        subtitle: const Text('جرّب: حسّن الفيديو • كرر من 1:20 إلى 1:50 • سرّع 1.5'),
                      ),
                      Expanded(child: ListView(padding: const EdgeInsets.all(12), children: [
                        for (final m in chat)
                          Align(
                            alignment: m['r'] == 'me' ? Alignment.centerRight : Alignment.centerLeft,
                            child: Container(margin: const EdgeInsets.symmetric(vertical: 4), padding: const EdgeInsets.all(10),
                              decoration: BoxDecoration(color: m['r'] == 'me' ? const Color(0xFF3E91FF) : const Color(0xFF232A38), borderRadius: BorderRadius.circular(14)),
                              child: Text(m['t']!)),
                          ),
                        if (busy) const Padding(padding: EdgeInsets.all(8), child: LinearProgressIndicator()),
                      ])),
                      Padding(padding: const EdgeInsets.all(10), child: Row(children: [
                        Expanded(child: TextField(controller: tc, onSubmitted: (_) => send(), decoration: InputDecoration(hintText: 'اكتب أمراً...', filled: true, border: OutlineInputBorder(borderRadius: BorderRadius.circular(30), borderSide: BorderSide.none)))),
                        IconButton(icon: const Icon(Icons.send), onPressed: send),
                      ])),
                    ])),
                  );
                }),
              );
            }
          }

          // ===== الذكاء الاصطناعي =====
          /// تحسين الجودة: فلاتر mpv تعمل لحظياً على الجهاز
          class Enhancer {
            static const presets = <String, Map<String, dynamic>>{
              'off': {'label': 'إيقاف', 'b': 0, 'c': 0, 's': 0, 'g': 0, 'vf': ''},
              'auto': {'label': 'تلقائي ✨', 'b': 2, 'c': 6, 's': 8, 'g': 0, 'vf': 'lavfi=[hqdn3d=1.5:1:3:3,unsharp=5:5:0.8]'},
              'sharp': {'label': 'حدّة عالية', 'b': 0, 'c': 8, 's': 5, 'g': 0, 'vf': 'lavfi=[unsharp=7:7:1.4]'},
              'lowlight': {'label': 'إضاءة منخفضة', 'b': 14, 'c': 8, 's': 6, 'g': 12, 'vf': 'lavfi=[hqdn3d=3:2:4:4,unsharp=5:5:0.6]'},
              'vivid': {'label': 'ألوان زاهية', 'b': 0, 'c': 10, 's': 22, 'g': 0, 'vf': 'lavfi=[unsharp=5:5:0.7]'},
              'denoise': {'label': 'إزالة التشويش', 'b': 0, 'c': 2, 's': 0, 'g': 0, 'vf': 'lavfi=[hqdn3d=4:3:6:6]'},
            };

            static Future<void> apply(Player p, String key, {Map<String, dynamic>? custom}) async {
              final n = p.platform as NativePlayer;
              final v = custom ?? presets[key] ?? presets['off']!;
              await n.setProperty('hwdec', key == 'off' ? 'auto-safe' : 'auto-copy');
              await n.setProperty('scale', key == 'off' ? 'bilinear' : 'ewa_lanczos');
              await n.setProperty('deband', key == 'off' ? 'no' : 'yes');
              await n.setProperty('brightness', '${v['b']}');
              await n.setProperty('contrast', '${v['c']}');
              await n.setProperty('saturation', '${v['s']}');
              await n.setProperty('gamma', '${v['g']}');
              await n.setProperty('vf', '${v['vf']}');
            }
          }

          /// المساعد الذكي: يتصل بالخادم الوسيط (المفتاح ليس في التطبيق)
          class AiService {
            // ضع رابط الـ Worker بعد النشر
            static const proxyUrl = String.fromEnvironment('PROXY_URL');
            // رمز عام للتطبيق (ليس سراً مطلقاً، الحماية الفعلية: الحد على الخادم)
            static const appToken = String.fromEnvironment('APP_TOKEN');

            Future<Map<String, dynamic>> ask(String text, Map<String, dynamic> state) async {
              final r = await http.post(
                Uri.parse(proxyUrl),
                headers: {'content-type': 'application/json', 'x-app-token': appToken},
                body: jsonEncode({'text': text, 'state': state}),
              );
              final d = jsonDecode(utf8.decode(r.bodyBytes));
              if (r.statusCode != 200) throw Exception(d['error']?['message'] ?? 'خطأ في الاتصال');
              final t = (d['content'][0]['text'] as String).replaceAll(RegExp(r'```json|```'), '').trim();
              return jsonDecode(t) as Map<String, dynamic>;
            }

            /// ترجمة أسطر الترجمة إلى أي لغة (عبر الخادم الوسيط)
            Future<List<String>> translate(List<String> lines, String lang) async {
              for (var attempt = 0; attempt < 2; attempt++) {
                final r = await http.post(
                  Uri.parse(proxyUrl),
                  headers: {'content-type': 'application/json', 'x-app-token': appToken},
                  body: jsonEncode({'mode': 'translate', 'lang': lang, 'lines': lines}),
                );
                final d = jsonDecode(utf8.decode(r.bodyBytes));
                if (r.statusCode != 200) throw Exception(d['error']?['message'] ?? 'خطأ في الاتصال');
                try {
                  final t = (d['content'][0]['text'] as String).replaceAll(RegExp(r'```json|```'), '').trim();
                  final out = (jsonDecode(t) as List).map((e) => '$e').toList();
                  if (out.length == lines.length) return out;
                } catch (_) {}
              }
              throw Exception('فشلت الترجمة، حاول مرة أخرى');
            }
          }

          // ===== معالجة ملفات الترجمة SRT / VTT =====
          class Cue {
            final String start, end, text;
            Cue(this.start, this.end, this.text);
          }

          String _normTime(String s) {
            s = s.trim().split(' ').first.replaceAll('.', ',');
            if (RegExp(r'^\d{1,2}:\d{2},').hasMatch(s)) s = '00:$s';
            return s;
          }

          List<Cue> parseSubs(String raw) {
            raw = raw.replaceAll('\r\n', '\n').replaceAll('\uFEFF', '');
            final cues = <Cue>[];
            for (final block in raw.split(RegExp(r'\n\s*\n'))) {
              final lines = block.trim().split('\n');
              final i = lines.indexWhere((l) => l.contains('-->'));
              if (i < 0) continue;
              final t = lines[i].split('-->');
              final text = lines.sublist(i + 1).join('\n').trim();
              if (text.isEmpty || t.length < 2) continue;
              cues.add(Cue(_normTime(t[0]), _normTime(t[1]), text));
            }
            return cues;
          }

          String buildSrt(List<Cue> cues, List<String> texts) {
            final b = StringBuffer();
            for (var i = 0; i < cues.length; i++) {
              b.writeln(i + 1);
              b.writeln('${cues[i].start} --> ${cues[i].end}');
              b.writeln(texts[i].trim());
              b.writeln();
            }
            return b.toString();
          }
          EOF

      - name: Check Dart Code (shows errors fast)
        run: |
          cd app_build
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK
        run: |
          cd app_build
          flutter build apk --release --split-per-abi \
            --dart-define=PROXY_URL=${{ secrets.PROXY_URL }} \
            --dart-define=APP_TOKEN=${{ secrets.APP_TOKEN }}

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Pro-Player-APK
          path: app_build/build/app/outputs/flutter-apk/*.apk
